[project]
name = "mimir"
version = "0.1.0"
description = "MIMIR: local-first operations investigation and on-call assistance platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Filip Bumbu" }]

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "anyio>=4.3",
    "tenacity>=8.2",
    # Orchestration
    "langgraph>=0.2.40",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # Persistence
    "SQLAlchemy>=2.0.30",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0.43",
    # Web helpers
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "markdownify>=0.12",
    # Retrieval
    "numpy>=1.26",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "langgraph-checkpoint-postgres>=2.0.0"]
mlx = ["mlx-lm>=0.14"]
search = ["ddgs>=9.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
mimir = "mimir.cli.main:run"
mimir-api = "mimir.api.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimir"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = ["B008", "RUF012", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false
